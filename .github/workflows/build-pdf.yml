name: Build thesis PDF

on:
  push:
    branches:
      - main
    paths:
      - 'document/**/*.tex'
      - 'document/**/*.bib'
      - 'document/images/**'
      - '.github/workflows/build-pdf.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'document/**/*.tex'
      - 'document/**/*.bib'
      - 'document/images/**'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile thesis with LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: document
          texlive_version: 2026

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: tesis-dental-pdf
          path: document/main.pdf
          if-no-files-found: error
          retention-days: 30
